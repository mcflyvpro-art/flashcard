<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Mirandola</title>
<!-- L'app elle-même : la page qu'on cherche, c'est l'accueil du site (index.html, à la racine). -->
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F6F5F1">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mirandola">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<!-- Peint avant tout le reste. La feuille de style est un fichier à part :
     le temps qu'elle arrive, l'écran n'appartenait à personne et le
     téléphone le remplissait de noir. Ces quelques règles tiennent dans
     la page elle-même, donc l'ouverture est là dès la première image. -->
<style>
html,body{margin:0;background:#F6F5F1;-webkit-text-size-adjust:100%}
/* L'ouverture (refaite le 2026-11-18, demandé : « la barre est moche, je
   veux un truc incroyable ») : un halo bleu-rose qui dérive lentement, la
   pile du logo qui se construit puis flotte (son animation est dans
   /ouverture.svg, tools/logo.py), et le nom qui arrive lettre par lettre. */
#boot{position:fixed;inset:0;z-index:80;overflow:hidden;background:#F6F5F1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#boot::before,#boot::after{content:'';position:absolute;z-index:-1;border-radius:50%;pointer-events:none;
  width:130vmax;height:130vmax;left:50%;top:50%;margin:-65vmax 0 0 -65vmax;
  background:radial-gradient(closest-side,rgba(90,118,208,.2),rgba(90,118,208,.06) 55%,transparent);
  animation:aura 1.4s cubic-bezier(.22,1,.3,1) both,derive 13s ease-in-out 1.4s infinite alternate}
#boot::after{width:110vmax;height:110vmax;margin:-55vmax 0 0 -55vmax;
  background:radial-gradient(closest-side,rgba(215,100,141,.17),rgba(154,120,207,.06) 58%,transparent);
  animation:aura 1.6s cubic-bezier(.22,1,.3,1) .15s both,derive2 16s ease-in-out 1.6s infinite alternate}
@keyframes aura{from{opacity:0;transform:scale(.4)}}
@keyframes derive{to{transform:translate(-14vmin,-10vmin) scale(1.08)}}
@keyframes derive2{to{transform:translate(16vmin,12vmin) scale(.92)}}
#boot img{width:148px;height:auto;margin-top:-62px}
#boot b{font-family:ui-serif,"Iowan Old Style",Charter,"Bitstream Charter","Palatino Linotype",Georgia,serif;
  font-size:38px;font-weight:700;letter-spacing:-.7px;color:#221C15;white-space:nowrap}
#boot b span{display:inline-block;animation:lettre .8s cubic-bezier(.22,1,.3,1) both;
  animation-delay:calc(1.05s + var(--i) * 55ms)}
@keyframes lettre{from{opacity:0;transform:translateY(.55em) rotate(6deg);filter:blur(7px)}}
@media (prefers-reduced-motion:reduce){#boot::before,#boot::after,#boot b span{animation:none}}
#boot p{margin:8px 0 6px;font:15px/1.45 system-ui,-apple-system,sans-serif;color:#5C564C;text-align:center;max-width:270px}
#boot .sec{display:flex;gap:10px}
#boot .sec button{font:600 15px system-ui,-apple-system,sans-serif;padding:11px 18px;border-radius:12px;
  border:1px solid rgba(34,28,21,.18);background:#fff;color:#221C15;cursor:pointer}
#boot .sec button:first-child{background:#221C15;border-color:#221C15;color:#fff}
</style>
<link rel="stylesheet" href="/src/app.css">
</head>
<body>
<i class="statusmask" aria-hidden="true"></i>
<!-- L'ouverture. Elle dure trois secondes pleines : la pile se construit et
     le nom arrive pendant que le compte, les paquets et la feuille de style
     finissent d'arriver, puis elle s'efface. -->
<div id="boot"><img src="/ouverture.svg" alt="" width="148" height="231"><b role="img" aria-label="Mirandola"><span style="--i:0">M</span><span style="--i:1">i</span><span style="--i:2">r</span><span style="--i:3">a</span><span style="--i:4">n</span><span style="--i:5">d</span><span style="--i:6">o</span><span style="--i:7">l</span><span style="--i:8">a</span></b></div>
<main id="app"></main>
<script>
/* L'écran de secours (2026-11-07). Si rien n'est venu dans #app au bout de
   15 s (un morceau du build qui ne se charge pas, un démarrage qui
   bloque), l'ouverture le dit et propose de réessayer, ou de réparer :
   retirer les copies hors ligne de l'app (service worker, caches), jamais
   les livres, qui sont dans le stockage de l'appareil. Script en ligne et
   seul, exprès : il doit marcher quand plus rien d'autre ne marche. Son
   empreinte est dans la CSP de vercel.json (test/demarrage.test.js). */
setTimeout(function () {
  var app = document.getElementById('app');
  if (!app || app.firstChild) return;
  var b = document.getElementById('boot');
  if (!b) { b = document.createElement('div'); b.id = 'boot'; document.body.appendChild(b); }
  b.className = '';
  b.innerHTML = '<b>Mirandola</b><p>Mirandola n\u2019arrive pas \u00e0 s\u2019ouvrir.</p>'
    + '<div class="sec"><button type="button" data-s="r">R\u00e9essayer</button>'
    + '<button type="button" data-s="p">R\u00e9parer</button></div>';
  var recharger = function () { location.reload(); };
  b.addEventListener('click', function (e) {
    var s = e.target && e.target.getAttribute ? e.target.getAttribute('data-s') : '';
    if (s === 'r') recharger();
    if (s !== 'p') return;
    var a = [];
    if ('serviceWorker' in navigator) a.push(navigator.serviceWorker.getRegistrations()
      .then(function (l) { return Promise.all(l.map(function (r) { return r.unregister(); })); }));
    if (window.caches) a.push(caches.keys()
      .then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
    Promise.all(a).then(recharger, recharger);
  });
  /* l'app finit par venir (un réseau très lent) : le secours s'en va */
  new MutationObserver(function (m, o) { if (app.firstChild) { o.disconnect(); b.remove(); } })
    .observe(app, { childList: true });
}, 15000);
</script>
<script type="module" src="/src/app.js"></script>
</body>
</html>
