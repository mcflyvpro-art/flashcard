name: Pages

# L'app ne se publie plus sur GitHub Pages : elle vit sur
# https://www.folioflashcard.online/ (Vercel). Ce déploiement ne sert qu'à
# faire suivre les anciens liens (https://mcflyvpro-art.github.io/flashcard/…)
# vers le domaine, code de classe, de partie ou livre partagé compris, et à
# désinscrire l'ancien service worker des téléphones qui l'avaient en cache.
# Pas de build : trois fichiers statiques, tools/pages-redirection/.
on:
  push:
    branches: [main]
    paths: ['tools/pages-redirection/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/pages-redirection
      - id: deployment
        uses: actions/deploy-pages@v4
