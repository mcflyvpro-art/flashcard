name: CodeQL

# L'analyse de sécurité du code de GitHub (gratuite pour un dépôt public) :
# injections, XSS, prototype pollution, redirections ouvertes, secrets en
# dur… sur tout le JavaScript, avec les requêtes « security-extended ». Les
# alertes arrivent dans l'onglet Security du dépôt.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - dist
              - node_modules
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
