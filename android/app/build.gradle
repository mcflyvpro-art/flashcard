apply plugin: 'com.android.application'

/* La version de l'app des magasins (docs/MAGASINS.md). Le numéro de build
   (versionCode) doit monter à chaque envoi à Google Play : la CI le tire du
   numéro de sa course (MIRANDOLA_VERSION_CODE, .github/workflows/natif.yml),
   1 sinon. Le nom (versionName) est celui que l'élève lit dans la fiche. */
def versionCodeDuBuild = (System.getenv('MIRANDOLA_VERSION_CODE') ?: findProperty('mirandolaVersionCode') ?: '1') as Integer
def versionNameDuBuild = System.getenv('MIRANDOLA_VERSION_NAME') ?: findProperty('mirandolaVersionName') ?: '1.0.0'

/* La clé qui signe ce qu'on envoie à Google Play (la « clé d'importation » :
   Google signe ensuite l'app avec la sienne). Jamais dans le dépôt : la CI
   la reçoit de ses secrets, une machine locale d'un keystore.properties
   ignoré par git (storeFile, storePassword, keyAlias, keyPassword). Sans
   elle, le build de publication sort non signé, et le reste marche. */
def signature = new Properties()
def fichierSignature = rootProject.file('keystore.properties')
if (fichierSignature.exists()) fichierSignature.withInputStream { signature.load(it) }
def cleDeSignature = System.getenv('MIRANDOLA_KEYSTORE') ?: signature.getProperty('storeFile')

android {
    namespace = "fr.mirandola.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fr.mirandola.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeDuBuild
        versionName versionNameDuBuild
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (cleDeSignature) {
                storeFile file(cleDeSignature)
                storePassword System.getenv('MIRANDOLA_KEYSTORE_PASSWORD') ?: signature.getProperty('storePassword')
                keyAlias System.getenv('MIRANDOLA_KEY_ALIAS') ?: signature.getProperty('keyAlias')
                keyPassword System.getenv('MIRANDOLA_KEY_PASSWORD') ?: signature.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (cleDeSignature) signingConfig signingConfigs.release
            /* Pas de réduction R8 : Capacitor retrouve ses greffons par
               réflexion (capacitor.plugins.json) ; l'app tient en quelques
               Mo, le gain ne vaut pas le risque d'un greffon effacé. */
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
