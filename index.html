<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Folio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FAF6EC">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Folio">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<!-- Peint avant tout le reste. La feuille de style est un fichier à part :
     le temps qu'elle arrive, l'écran n'appartenait à personne et le
     téléphone le remplissait de noir. Ces quelques règles tiennent dans
     la page elle-même, donc l'ouverture est là dès la première image. -->
<style>
html,body{margin:0;background:#FAF6EC;-webkit-text-size-adjust:100%}
#boot{position:fixed;inset:0;z-index:80;background:#FAF6EC;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px}
#boot img{width:84px;height:84px;border-radius:26px;
  box-shadow:0 10px 30px -12px rgba(34,28,21,.45);
  animation:bookin .85s cubic-bezier(.2,1.1,.3,1) both}
#boot b{font-family:ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  font-size:30px;font-weight:700;letter-spacing:-.5px;color:#221C15;
  animation:bootname .7s cubic-bezier(.22,1,.3,1) .3s both}
#boot i{position:relative;display:block;width:104px;height:2px;border-radius:2px;
  overflow:hidden;background:rgba(34,28,21,.12);
  animation:bootname .5s cubic-bezier(.22,1,.3,1) .62s both}
#boot i::after{content:'';position:absolute;inset:0;border-radius:2px;background:#221C15;
  transform-origin:left center;animation:bootbar 2.3s cubic-bezier(.35,.5,.2,1) .66s both}
@keyframes bookin{from{opacity:0;transform:translateY(22px) scale(.84) rotate(-6deg)}}
@keyframes bootname{from{opacity:0;transform:translateY(10px)}}
@keyframes bootbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<i class="statusmask" aria-hidden="true"></i>
<!-- L'ouverture. Elle dure trois secondes pleines : le trait sous le nom
     se remplit pendant que le compte, les livres et la feuille de style
     finissent d'arriver, puis elle s'efface. -->
<div id="boot"><img src="icons/icon-192.png" alt=""><b>Folio</b><i aria-hidden="true"></i></div>
<main id="app"></main>
<script src="app.js"></script>
</body>
</html>
