<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>
/* L'aiguillage. Cette page est l'accueil du site ; l'app vit à /app. Qui a
   déjà l'app (une session sur cet appareil, l'icône installée, l'app
   native) ou arrive par un de ses liens (QR d'une carte élève, code de
   classe, de partie ou de club, livre partagé, raccourci, retour d'un
   e-mail de connexion) y passe aussitôt, avant le moindre affichage.
   « ?site » montre l'accueil même avec une session. Premier script de la
   page, sans dépendance, et il ne doit jamais jeter. docs/LANDING.md. */
(function () {
  try {
    var l = location, q = l.search, h = l.hash, s = false;
    if (/[?&]site(=|&|$)/.test(q)) return;
    try { s = !!localStorage.getItem('cartes.auth'); } catch (e) { s = false; }
    var lien = /[?&](carte|rejoindre|defi|club|go)=/.test(q) || /^#[si]=/.test(h)
      || /(access_token|error_code|error_description)=/.test(h + q);
    var app = !!(window.Capacitor || navigator.standalone
      || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
    if (lien || app || s) l.replace((window.Capacitor ? '/app.html' : '/app') + q + h);
  } catch (e) { /* au pire, l'accueil s'affiche : il mène aussi à l'app */ }
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folio</title>
</head>
<body><h1>Folio</h1></body>
</html>
